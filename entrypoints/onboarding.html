<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elements</title>
    <link rel="stylesheet" href="../src/qds/qds-tokens.css" />
    <link rel="stylesheet" href="../src/qds/adapter/document.css" />
    <link rel="stylesheet" href="../src/qds/primitives.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        padding: var(--qds-space-12) var(--qds-space-5) var(--qds-space-16);
        background: var(--el-bg);
        color: var(--el-text);
        font: var(--qds-type-body-weight) var(--qds-type-body-size) / var(--qds-type-body-line)
          var(--qds-type-body-family);
      }

      :where(a, button, [tabindex]):focus-visible {
        outline: var(--qds-stroke-focus) solid var(--el-accent);
        outline-offset: var(--qds-stroke-focus);
      }

      .page {
        max-width: var(--qds-component-overlay-sheet-readable-width);
        margin: 0 auto;
      }

      @keyframes heroIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes bracketIn {
        from {
          opacity: 0;
          transform: scale(1.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .hero {
        text-align: center;
        margin-bottom: var(--qds-space-8);
        animation: heroIn var(--qds-motion-spatial-long) var(--el-ease-out) backwards;
      }

      .hero__mark {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: calc(var(--qds-size-target-touch) * 2);
        height: calc(var(--qds-size-target-touch) * 2);
        margin-bottom: var(--qds-space-5);
        color: var(--el-accent);
      }

      .hero__bracket {
        position: absolute;
        width: var(--qds-size-icon-xl);
        height: var(--qds-size-icon-xl);
        animation: bracketIn var(--qds-motion-spatial-long) var(--el-ease-out) backwards;
      }

      .hero__bracket_tl {
        top: 0;
        left: 0;
        border-top: solid
          calc(var(--qds-stroke-hairline) + var(--qds-stroke-default) + var(--qds-stroke-focus))
          currentColor;
        border-left: solid
          calc(var(--qds-stroke-hairline) + var(--qds-stroke-default) + var(--qds-stroke-focus))
          currentColor;
        border-top-left-radius: var(--qds-radius-group);
        animation-delay: var(--qds-motion-hover);
      }
      .hero__bracket_tr {
        top: 0;
        right: 0;
        border-top: solid
          calc(var(--qds-stroke-hairline) + var(--qds-stroke-default) + var(--qds-stroke-focus))
          currentColor;
        border-right: solid
          calc(var(--qds-stroke-hairline) + var(--qds-stroke-default) + var(--qds-stroke-focus))
          currentColor;
        border-top-right-radius: var(--qds-radius-group);
        animation-delay: var(--qds-motion-disclosure);
      }
      .hero__bracket_bl {
        bottom: 0;
        left: 0;
        border-bottom: solid
          calc(var(--qds-stroke-hairline) + var(--qds-stroke-default) + var(--qds-stroke-focus))
          currentColor;
        border-left: solid
          calc(var(--qds-stroke-hairline) + var(--qds-stroke-default) + var(--qds-stroke-focus))
          currentColor;
        border-bottom-left-radius: var(--qds-radius-group);
        animation-delay: var(--qds-motion-spatial-long);
      }
      .hero__bracket_br {
        bottom: 0;
        right: 0;
        border-bottom: solid
          calc(var(--qds-stroke-hairline) + var(--qds-stroke-default) + var(--qds-stroke-focus))
          currentColor;
        border-right: solid
          calc(var(--qds-stroke-hairline) + var(--qds-stroke-default) + var(--qds-stroke-focus))
          currentColor;
        border-bottom-right-radius: var(--qds-radius-group);
        animation-delay: var(--qds-motion-spatial-long);
      }

      .hero__lines {
        display: flex;
        flex-direction: column;
        gap: var(--qds-space-2);
      }

      .hero__line {
        height: 6px;
        border-radius: var(--qds-radius-none);
        background: var(--el-accent);
        animation: heroIn var(--qds-motion-spatial-long) var(--el-ease-out) backwards;
      }

      .hero__line:nth-child(1) {
        width: var(--qds-size-target-touch);
        animation-delay: var(--qds-motion-disclosure);
      }
      .hero__line:nth-child(2) {
        width: var(--qds-size-control-standard);
        opacity: 0.75;
        animation-delay: var(--qds-motion-spatial-long);
      }
      .hero__line:nth-child(3) {
        width: var(--qds-size-control-prominent);
        opacity: 0.55;
        animation-delay: var(--qds-motion-spatial-long);
      }

      h1 {
        font-size: var(--qds-type-screen-title-size);
        font-weight: var(--qds-type-display-weight);
        letter-spacing: var(--qds-type-section-title-tracking);
        color: var(--el-text-strong);
        margin: 0 0 var(--qds-space-2);
        text-wrap: balance;
      }

      .hero__tagline {
        font-size: var(--qds-type-section-title-size);
        color: var(--el-text-muted);
        margin: 0 auto;
        max-width: var(--qds-component-overlay-dialog-readable-width);
        text-wrap: pretty;
      }

      .hero__actions {
        display: grid;
        justify-items: center;
        gap: var(--qds-space-2);
        margin-top: var(--qds-space-6);
      }

      .hero__actions .qds-button {
        min-height: var(--qds-size-control-prominent);
        padding-inline: var(--qds-component-button-padding-x-prominent);
      }

      .hero__hint,
      .shortcut,
      .ready {
        font: var(--qds-type-supporting-weight) var(--qds-type-supporting-size) /
          var(--qds-type-supporting-line) var(--qds-type-supporting-family);
      }

      .hero__hint {
        margin: 0;
        color: var(--el-text-muted);
      }

      .shortcut {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: var(--qds-space-2);
        margin-top: var(--qds-space-4);
        color: var(--el-text-muted);
      }

      .shortcut__keys {
        display: inline-flex;
        flex-wrap: wrap;
        gap: var(--qds-component-keycap-gap);
      }

      .shortcut__empty {
        color: var(--el-text);
        font-weight: var(--qds-type-body-emphasized-weight);
      }

      .ready {
        display: grid;
        gap: var(--qds-space-1);
        margin: var(--qds-space-4) auto 0;
        padding: var(--qds-space-3) var(--qds-space-4);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-group);
        background: var(--el-accent-soft);
        color: var(--el-text);
        text-align: left;
      }

      .ready strong {
        color: var(--el-text-strong);
        font: var(--qds-type-body-emphasized-weight) var(--qds-type-body-emphasized-size) /
          var(--qds-type-body-emphasized-line) var(--qds-type-body-emphasized-family);
      }

      .steps {
        display: grid;
        gap: var(--qds-space-3);
      }

      .step {
        display: flex;
        align-items: center;
        gap: var(--qds-space-4);
        background: var(--el-surface);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-panel);
        box-shadow: var(--el-shadow-card);
        padding: var(--qds-space-5) var(--qds-space-5);
        animation: heroIn var(--qds-motion-spatial-long) var(--el-ease-out) backwards;
      }

      .step:nth-child(1) {
        animation-delay: var(--qds-motion-floating-fast);
      }
      .step:nth-child(2) {
        animation-delay: var(--qds-motion-disclosure);
      }
      .step:nth-child(3) {
        animation-delay: var(--qds-motion-spatial-long);
      }

      .step__number {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--qds-size-control-standard);
        height: var(--qds-size-control-standard);
        flex: none;
        border-radius: var(--qds-radius-group);
        background: var(--el-accent-soft);
        color: var(--el-accent);
        font-size: var(--qds-type-section-title-size);
        font-weight: var(--qds-type-display-weight);
        font-variant-numeric: tabular-nums;
      }

      .step__title {
        margin: var(--qds-space-1) 0 var(--qds-space-1);
        font-size: var(--qds-type-section-title-size);
        font-weight: var(--qds-type-display-weight);
        color: var(--el-text-strong);
      }

      .step__body {
        margin: 0;
        font-size: var(--qds-type-row-size);
        color: var(--el-text-muted);
        text-wrap: pretty;
      }

      .guided-trial {
        margin-top: var(--qds-space-6);
      }

      .guided-trial h2 {
        margin: 0 0 var(--qds-space-1);
        color: var(--el-text-strong);
        font: var(--qds-type-section-title-weight) var(--qds-type-section-title-size) /
          var(--qds-type-section-title-line) var(--qds-type-section-title-family);
      }

      .guided-trial p {
        margin: 0;
        color: var(--el-text-muted);
        font-size: var(--qds-type-supporting-size);
      }

      .section-eyebrow {
        margin-bottom: var(--qds-space-1) !important;
        color: var(--el-accent);
        font-size: var(--qds-type-compact-metadata-size) !important;
        font-weight: var(--qds-type-compact-metadata-weight);
        letter-spacing: var(--qds-type-compact-metadata-tracking);
        text-transform: uppercase;
      }

      .trial-canvas {
        display: grid;
        min-height: calc(var(--qds-size-row-comfortable) * 2);
        place-items: center;
        padding: var(--qds-space-4);
        border: var(--qds-stroke-default) dashed var(--el-border);
        border-radius: var(--qds-radius-group);
        background: var(--el-bg);
      }

      .trial-target {
        display: grid;
        gap: var(--qds-space-1);
        width: min(100%, var(--qds-size-sidebar-standard));
        min-height: var(--qds-size-rail-compact);
        padding: var(--qds-space-3);
        border: var(--qds-stroke-emphasis) solid var(--el-border);
        border-radius: var(--qds-radius-control);
        background: var(--el-surface);
        color: var(--el-text-strong);
        cursor: pointer;
        text-align: left;
        transition:
          border-color var(--qds-motion-hover) var(--qds-ease-standard),
          opacity var(--qds-motion-disclosure) var(--qds-ease-standard),
          border-radius var(--qds-motion-disclosure) var(--qds-ease-standard);
      }

      .trial-target span {
        color: var(--el-text);
        font-size: var(--qds-type-supporting-size);
      }

      .trial-canvas.is-selected .trial-target {
        border-color: var(--el-accent);
      }

      .trial-canvas[data-action='hide'] .trial-target {
        border-style: dashed;
        background: var(--el-surface-alt);
        text-decoration: line-through;
      }

      .trial-canvas[data-action='round'] .trial-target {
        border-radius: var(--qds-radius-hero);
      }

      .trial-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--qds-space-2);
      }

      .trial-actions .qds-button {
        flex: 1 1 110px;
      }

      .trial-status {
        min-height: var(--qds-type-supporting-line);
      }

      .privacy {
        margin-top: var(--qds-space-6);
        padding: var(--qds-space-4) var(--qds-space-5);
        border: var(--qds-stroke-default) solid var(--el-accent);
        background: var(--el-accent-soft);
        border-radius: var(--qds-radius-panel);
        animation: heroIn var(--qds-motion-spatial-long) var(--el-ease-out)
          var(--qds-motion-spatial-long) backwards;
      }

      .privacy__title {
        margin: 0 0 var(--qds-space-1);
        font-size: var(--qds-type-body-size);
        font-weight: var(--qds-type-display-weight);
        color: var(--el-text-strong);
      }

      .privacy__body {
        margin: 0;
        font-size: var(--qds-type-row-size);
        color: var(--el-text);
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        justify-content: center;
        margin-top: var(--qds-space-8);
        animation: heroIn var(--qds-motion-spatial-long) var(--el-ease-out)
          var(--qds-motion-spatial-long) backwards;
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .hero__bracket,
        .hero__line,
        .step,
        .privacy,
        .actions {
          animation: none;
        }

        .trial-target {
          transition: none;
        }
      }

      @media (prefers-contrast: more) {
        .step,
        .ready,
        .trial,
        .trial-target,
        .privacy {
          border-color: var(--qds-border-focus);
          border-width: var(--qds-stroke-emphasis);
        }

        .hero__tagline,
        .step__body,
        .trial__body,
        .privacy__body {
          color: var(--qds-text-primary);
        }
      }

      @media (forced-colors: active) {
        .step,
        .ready,
        .trial,
        .trial-target,
        .privacy,
        button,
        a {
          border-color: ButtonBorder;
          background: Canvas;
          color: CanvasText;
          forced-color-adjust: auto;
        }

        .trial-canvas.is-selected .trial-target {
          border-color: Highlight;
        }

        :focus-visible {
          outline-color: Highlight;
        }
      }
    </style>
    <script type="module" src="./onboarding/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
