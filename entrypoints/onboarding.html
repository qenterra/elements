<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elements</title>
    <link rel="stylesheet" href="../src/qds/qds-tokens.css" />
    <link rel="stylesheet" href="../src/qds/adapter/document.css" />
    <link rel="stylesheet" href="../src/qds/primitives.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        padding: 56px 20px 72px;
        background: var(--el-bg);
        color: var(--el-text);
        font:
          15px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      :where(a, button, [tabindex]):focus-visible {
        outline: 2px solid var(--el-accent);
        outline-offset: 2px;
      }

      .page {
        max-width: 560px;
        margin: 0 auto;
      }

      @keyframes heroIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes bracketIn {
        from {
          opacity: 0;
          transform: scale(1.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .hero {
        text-align: center;
        margin-bottom: var(--qds-space-8);
        animation: heroIn 0.4s var(--el-ease-out) backwards;
      }

      .hero__mark {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 88px;
        height: 88px;
        margin-bottom: 20px;
        color: var(--el-accent);
      }

      .hero__bracket {
        position: absolute;
        width: 22px;
        height: 22px;
        animation: bracketIn 0.5s var(--el-ease-out) backwards;
      }

      .hero__bracket_tl {
        top: 0;
        left: 0;
        border-top: solid 3.5px currentColor;
        border-left: solid 3.5px currentColor;
        border-top-left-radius: 10px;
        animation-delay: 0.1s;
      }
      .hero__bracket_tr {
        top: 0;
        right: 0;
        border-top: solid 3.5px currentColor;
        border-right: solid 3.5px currentColor;
        border-top-right-radius: 10px;
        animation-delay: 0.18s;
      }
      .hero__bracket_bl {
        bottom: 0;
        left: 0;
        border-bottom: solid 3.5px currentColor;
        border-left: solid 3.5px currentColor;
        border-bottom-left-radius: 10px;
        animation-delay: 0.26s;
      }
      .hero__bracket_br {
        bottom: 0;
        right: 0;
        border-bottom: solid 3.5px currentColor;
        border-right: solid 3.5px currentColor;
        border-bottom-right-radius: 10px;
        animation-delay: 0.34s;
      }

      .hero__lines {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .hero__line {
        height: 6px;
        border-radius: 3px;
        background: var(--el-accent);
        animation: heroIn 0.4s var(--el-ease-out) backwards;
      }

      .hero__line:nth-child(1) {
        width: 44px;
        animation-delay: 0.2s;
      }
      .hero__line:nth-child(2) {
        width: 30px;
        opacity: 0.75;
        animation-delay: 0.28s;
      }
      .hero__line:nth-child(3) {
        width: 37px;
        opacity: 0.55;
        animation-delay: 0.36s;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--el-text-strong);
        margin: 0 0 10px;
        text-wrap: balance;
      }

      .hero__tagline {
        font-size: 15px;
        color: var(--el-text-muted);
        margin: 0 auto;
        max-width: 430px;
        text-wrap: pretty;
      }

      .hero__actions {
        display: grid;
        justify-items: center;
        gap: var(--qds-space-2);
        margin-top: var(--qds-space-6);
      }

      .hero__actions .qds-button {
        min-height: var(--qds-size-control-prominent);
        padding-inline: var(--qds-component-button-padding-x-prominent);
      }

      .hero__hint,
      .shortcut,
      .ready {
        font: var(--qds-type-supporting-weight) var(--qds-type-supporting-size) /
          var(--qds-type-supporting-line) var(--qds-type-supporting-family);
      }

      .hero__hint {
        margin: 0;
        color: var(--el-text-muted);
      }

      .shortcut {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: var(--qds-space-2);
        margin-top: var(--qds-space-4);
        color: var(--el-text-muted);
      }

      .shortcut__keys {
        display: inline-flex;
        flex-wrap: wrap;
        gap: var(--qds-component-keycap-gap);
      }

      .shortcut__empty {
        color: var(--el-text);
        font-weight: var(--qds-type-body-emphasized-weight);
      }

      .ready {
        display: grid;
        gap: var(--qds-space-1);
        margin: var(--qds-space-4) auto 0;
        padding: var(--qds-space-3) var(--qds-space-4);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-group);
        background: var(--el-accent-soft);
        color: var(--el-text);
        text-align: left;
      }

      .ready strong {
        color: var(--el-text-strong);
        font: var(--qds-type-body-emphasized-weight) var(--qds-type-body-emphasized-size) /
          var(--qds-type-body-emphasized-line) var(--qds-type-body-emphasized-family);
      }

      .steps {
        display: grid;
        gap: var(--qds-space-3);
      }

      .step {
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--el-surface);
        border: 1px solid var(--el-border);
        border-radius: 16px;
        box-shadow: var(--el-shadow-card);
        padding: 20px 22px;
        animation: heroIn 0.3s var(--el-ease-out) backwards;
      }

      .step:nth-child(1) {
        animation-delay: 0.12s;
      }
      .step:nth-child(2) {
        animation-delay: 0.2s;
      }
      .step:nth-child(3) {
        animation-delay: 0.28s;
      }

      .step__number {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 11px;
        background: var(--el-accent-soft);
        color: var(--el-accent);
        font-size: 15px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .step__title {
        margin: 4px 0 3px;
        font-size: 15px;
        font-weight: 700;
        color: var(--el-text-strong);
      }

      .step__body {
        margin: 0;
        font-size: 13.5px;
        color: var(--el-text-muted);
        text-wrap: pretty;
      }

      .guided-trial {
        margin-top: var(--qds-space-6);
      }

      .guided-trial h2 {
        margin: 0 0 var(--qds-space-1);
        color: var(--el-text-strong);
        font: var(--qds-type-section-title-weight) var(--qds-type-section-title-size) /
          var(--qds-type-section-title-line) var(--qds-type-section-title-family);
      }

      .guided-trial p {
        margin: 0;
        color: var(--el-text-muted);
        font-size: var(--qds-type-supporting-size);
      }

      .section-eyebrow {
        margin-bottom: var(--qds-space-1) !important;
        color: var(--el-accent);
        font-size: var(--qds-type-compact-metadata-size) !important;
        font-weight: var(--qds-type-compact-metadata-weight);
        letter-spacing: var(--qds-type-compact-metadata-tracking);
        text-transform: uppercase;
      }

      .trial-canvas {
        display: grid;
        min-height: 112px;
        place-items: center;
        padding: var(--qds-space-4);
        border: var(--qds-stroke-default) dashed var(--el-border);
        border-radius: var(--qds-radius-group);
        background: var(--el-bg);
      }

      .trial-target {
        display: grid;
        gap: var(--qds-space-1);
        width: min(100%, 260px);
        min-height: 64px;
        padding: var(--qds-space-3);
        border: var(--qds-stroke-emphasis) solid var(--el-border);
        border-radius: var(--qds-radius-control);
        background: var(--el-surface);
        color: var(--el-text-strong);
        cursor: pointer;
        text-align: left;
        transition:
          border-color var(--qds-motion-hover) var(--qds-ease-standard),
          opacity var(--qds-motion-disclosure) var(--qds-ease-standard),
          border-radius var(--qds-motion-disclosure) var(--qds-ease-standard);
      }

      .trial-target span {
        color: var(--el-text);
        font-size: var(--qds-type-supporting-size);
      }

      .trial-canvas.is-selected .trial-target {
        border-color: var(--el-accent);
      }

      .trial-canvas[data-action='hide'] .trial-target {
        border-style: dashed;
        background: var(--el-surface-alt);
        text-decoration: line-through;
      }

      .trial-canvas[data-action='round'] .trial-target {
        border-radius: var(--qds-radius-hero);
      }

      .trial-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--qds-space-2);
      }

      .trial-actions .qds-button {
        flex: 1 1 110px;
      }

      .trial-status {
        min-height: var(--qds-type-supporting-line);
      }

      .privacy {
        margin-top: 26px;
        padding: 18px 22px;
        border: 1px solid var(--el-accent);
        background: var(--el-accent-soft);
        border-radius: 16px;
        animation: heroIn 0.3s var(--el-ease-out) 0.36s backwards;
      }

      .privacy__title {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 700;
        color: var(--el-text-strong);
      }

      .privacy__body {
        margin: 0;
        font-size: 13.5px;
        color: var(--el-text);
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        justify-content: center;
        margin-top: 30px;
        animation: heroIn 0.3s var(--el-ease-out) 0.44s backwards;
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .hero__bracket,
        .hero__line,
        .step,
        .privacy,
        .actions {
          animation: none;
        }

        .trial-target {
          transition: none;
        }
      }
    </style>
    <script type="module" src="./onboarding/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
