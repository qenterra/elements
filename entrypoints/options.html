<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="wxt.open_in_tab" content="true" />
    <title>Elements</title>
    <link rel="stylesheet" href="../src/qds/qds-tokens.css" />
    <link rel="stylesheet" href="../src/qds/adapter/document.css" />
    <link rel="stylesheet" href="../src/qds/primitives.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        padding: var(--qds-space-12) var(--qds-space-5) var(--qds-space-16);
        background: var(--el-bg);
        color: var(--el-text);
        font: var(--qds-type-body-weight) var(--qds-type-body-size) / var(--qds-type-body-line)
          var(--qds-type-body-family);
      }

      :where(a, button, input, [tabindex]):focus-visible {
        outline: var(--qds-stroke-focus) solid var(--el-accent);
        outline-offset: var(--qds-stroke-focus);
      }

      .page {
        position: relative;
        z-index: 1;
        max-width: var(--qds-size-content-readable);
        margin: 0 auto;
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .card.pageHeader {
        display: flex;
        align-items: center;
        gap: var(--qds-space-4);
        padding: var(--qds-space-5) var(--qds-space-6);
      }

      .pageHeader__icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--qds-size-target-touch);
        height: var(--qds-size-target-touch);
        border-radius: var(--qds-radius-panel);
        background: var(--el-accent-soft);
        color: var(--el-accent);
        flex: none;
      }

      h1 {
        font-size: var(--qds-type-modal-title-size);
        font-weight: var(--qds-type-display-weight);
        letter-spacing: var(--qds-type-section-title-tracking);
        color: var(--el-text-strong);
        margin: 0;
        text-wrap: balance;
      }

      .pageHeader__tagline {
        margin: var(--qds-space-1) 0 0;
        font-size: var(--qds-type-supporting-size);
        color: var(--el-text-muted);
        text-wrap: pretty;
      }

      .card {
        position: relative;
        isolation: isolate;
        background: var(--el-surface);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-panel);
        box-shadow: var(--el-shadow-card);
        padding: var(--qds-space-6) var(--qds-space-6) var(--qds-space-6);
        animation: cardIn var(--qds-motion-spatial-long) var(--el-ease-out) backwards;
        transition:
          background-color var(--qds-motion-replace) ease,
          border-color var(--qds-motion-replace) ease;
      }

      .card::after {
        content: '';
        position: absolute;
        inset: calc(-1 * var(--qds-stroke-default));
        border: var(--qds-stroke-default) solid var(--el-accent);
        border-radius: inherit;
        opacity: 0;
        transform: scale(0.996);
        pointer-events: none;
        transition:
          opacity var(--qds-motion-disclosure) ease,
          transform var(--qds-motion-spatial-long) var(--el-ease-out);
      }

      .card:focus-within::after {
        opacity: 0.45;
        transform: scale(1);
      }

      .card:nth-child(2) {
        animation-delay: var(--qds-motion-instant);
      }
      .card:nth-child(3) {
        animation-delay: var(--qds-motion-press);
      }
      .card:nth-child(4) {
        animation-delay: var(--qds-motion-floating-fast);
      }
      .card:nth-child(5) {
        animation-delay: var(--qds-motion-dismiss);
      }

      .card + .card {
        margin-top: var(--qds-space-5);
      }

      .cardTitle {
        display: flex;
        align-items: center;
        gap: var(--qds-space-2);
        font-size: var(--qds-type-section-title-size);
        font-weight: var(--qds-type-section-title-weight);
        letter-spacing: var(--qds-type-section-title-tracking);
        color: var(--el-text-strong);
        margin: 0 0 var(--qds-space-1);
      }

      .cardTitle svg {
        color: var(--el-accent);
        flex: none;
      }

      .cardDescription {
        font-size: var(--qds-type-row-size);
        color: var(--el-text-muted);
        margin: 0 0 var(--qds-space-4);
        text-wrap: pretty;
      }

      .cardDescription code {
        font: var(--qds-type-compact-metadata-weight) var(--qds-type-compact-metadata-size) /
          var(--qds-type-compact-metadata-line) var(--qds-type-monospaced-data-family);
        background: var(--el-surface-alt);
        color: var(--el-text);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-control);
        padding: var(--qds-space-0) var(--qds-space-1);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: var(--qds-space-3);
        margin-top: var(--qds-space-5);
      }

      button.primary,
      button.secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--qds-space-2);
        font: inherit;
        font-size: var(--qds-type-row-size);
        font-weight: var(--qds-type-section-title-weight);
        cursor: pointer;
        min-width: calc(var(--qds-space-20) + var(--qds-space-8));
        color: var(--el-accent-contrast);
        background: var(--el-accent);
        border: var(--qds-stroke-default) solid transparent;
        padding: var(--qds-space-2) var(--qds-space-4);
        border-radius: var(--qds-radius-group);
        transition:
          background-color var(--qds-motion-replace) ease,
          transform var(--qds-motion-floating-fast) var(--el-ease-out),
          border-color var(--qds-motion-replace) ease,
          opacity var(--qds-motion-replace) ease;
      }

      button.primary:active:not(:disabled),
      button.secondary:active:not(:disabled) {
        transform: scale(0.97);
      }

      button.primary:disabled,
      button.secondary:disabled {
        cursor: default;
        opacity: 0.6;
      }

      button.secondary {
        color: var(--el-text-strong);
        background: var(--el-surface-alt);
        border: var(--qds-stroke-default) solid var(--el-border);
      }

      .spinner {
        width: var(--qds-size-icon-s);
        height: var(--qds-size-icon-s);
        flex: none;
        border-radius: 50%;
        border: var(--qds-stroke-emphasis) solid currentColor;
        border-top-color: transparent;
        animation: spin var(--qds-motion-spatial-long) linear infinite;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: var(--qds-space-8);
        transform: translate(-50%, 14px);
        display: flex;
        align-items: center;
        gap: var(--qds-space-2);
        background: var(--el-surface);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-group);
        box-shadow: var(--el-shadow-card);
        padding: var(--qds-space-3) var(--qds-space-4);
        font-size: var(--qds-type-row-size);
        font-weight: var(--qds-type-section-title-weight);
        color: var(--el-text-strong);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity var(--qds-motion-dismiss) var(--el-ease-out),
          transform var(--qds-motion-disclosure) var(--el-ease-out);
        z-index: 10;
      }

      .toast.isVisible {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, 0);
      }

      .toast__icon {
        flex: none;
        color: var(--el-success);
      }

      .toast.isError {
        border-color: var(--el-danger);
      }

      .toast.isError .toast__icon {
        color: var(--el-danger);
      }

      .toast__undo {
        font: inherit;
        font-size: var(--qds-type-supporting-size);
        font-weight: var(--qds-type-display-weight);
        color: var(--el-accent);
        background: transparent;
        border: 0;
        border-radius: var(--qds-radius-control);
        padding: var(--qds-space-0) var(--qds-space-1);
        cursor: pointer;
        transition: background-color var(--qds-motion-replace) ease;
      }

      .toast__undo:disabled {
        cursor: default;
        opacity: var(--qds-opacity-disabled);
      }

      .toast__undoError {
        color: var(--qds-state-destructive);
        font-size: var(--qds-type-supporting-size);
      }

      .sortSwitch,
      .segment {
        display: inline-flex;
        gap: var(--qds-space-0);
        background: var(--el-surface-alt);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-control);
        padding: var(--qds-space-0);
      }

      .sortSwitch {
        margin-left: auto;
      }

      .sortSwitch__btn,
      .segment__btn {
        min-height: var(--qds-size-control-standard);
        font: inherit;
        font-size: var(--qds-type-metadata-size);
        font-weight: var(--qds-type-section-title-weight);
        color: var(--el-text);
        background: none;
        border: none;
        border-radius: var(--qds-radius-control);
        padding: var(--qds-space-1) var(--qds-space-3);
        cursor: pointer;
        transition:
          color var(--qds-motion-replace) ease,
          background-color var(--qds-motion-replace) ease,
          transform var(--qds-motion-floating-fast) var(--el-ease-out);
      }

      .sortSwitch__btn:active,
      .segment__btn:active {
        transform: scale(0.97);
      }

      .sortSwitch__btn.isActive,
      .segment__btn.isActive {
        color: var(--el-accent);
        background: var(--el-accent-soft);
      }

      .search {
        display: block;
        width: 100%;
        margin: 0 0 var(--qds-space-3);
        font: inherit;
        font-size: var(--qds-type-row-size);
        color: var(--el-text-strong);
        background: var(--el-surface-alt);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-group);
        padding: var(--qds-space-2) var(--qds-space-3);
        transition: border-color var(--qds-motion-replace) ease;
      }

      .search:focus {
        outline: none;
        border-color: var(--el-accent);
      }

      .search::placeholder {
        color: var(--el-text-muted);
      }

      .siteList {
        background: var(--el-surface-alt);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-group);
        padding: var(--qds-space-1);
      }

      .siteList__rows {
        display: flex;
        flex-direction: column;
        gap: var(--qds-space-0);
      }

      .siteList__empty {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--qds-space-2);
        font-size: var(--qds-type-supporting-size);
        color: var(--el-text-muted);
        margin: var(--qds-space-2) var(--qds-space-2);
        text-wrap: pretty;
        text-align: center;
      }

      .bracket {
        position: relative;
        width: 9px;
        height: var(--qds-size-icon-m);
        flex: none;
        opacity: 0.7;
      }

      .bracket::before,
      .bracket::after {
        content: '';
        position: absolute;
        left: 0;
        width: 8px;
        height: 6px;
        border-left: solid var(--qds-stroke-emphasis) var(--el-accent);
      }

      .bracket::before {
        top: 0;
        border-top: solid var(--qds-stroke-emphasis) var(--el-accent);
        border-top-left-radius: var(--qds-radius-control);
      }

      .bracket::after {
        bottom: 0;
        border-bottom: solid var(--qds-stroke-emphasis) var(--el-accent);
        border-bottom-left-radius: var(--qds-radius-control);
      }

      .bracket_r {
        transform: scaleX(-1);
      }

      .siteRow {
        border-radius: var(--qds-radius-control);
        animation: rowIn var(--qds-motion-disclosure) var(--el-ease-out) both;
        animation-delay: calc(var(--row-index, 0) * var(--qds-motion-instant));
        transition: background-color var(--qds-motion-replace) ease;
      }

      .siteRow.isPaused .siteRow__domain {
        color: var(--el-text-muted);
      }

      .siteRow__head {
        display: flex;
        align-items: center;
        gap: var(--qds-space-2);
        padding: var(--qds-space-1) var(--qds-space-2);
      }

      .siteRow__expand {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--qds-size-icon-xl);
        height: var(--qds-size-icon-xl);
        flex: none;
        border: 0;
        border-radius: var(--qds-radius-control);
        background: transparent;
        color: var(--el-text-muted);
        cursor: pointer;
        padding: 0;
        transition:
          color var(--qds-motion-replace) ease,
          background-color var(--qds-motion-replace) ease;
      }

      .siteRow__expand svg {
        transform: rotate(0deg);
        transition: transform var(--qds-motion-disclosure) var(--el-ease-out);
      }

      .siteRow.isExpanded .siteRow__expand svg {
        transform: rotate(90deg);
      }

      .siteRow__domain {
        flex: 1;
        min-width: var(--qds-space-20);
        font-size: var(--qds-type-row-size);
        font-weight: var(--qds-type-section-title-weight);
        color: var(--el-text-strong);
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .siteRow__count {
        flex: none;
        font-size: var(--qds-type-metadata-size);
        font-variant-numeric: tabular-nums;
        color: var(--el-text-strong);
        background: var(--el-surface);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-floating);
        padding: var(--qds-space-0) var(--qds-space-2);
      }

      .siteRow__date {
        flex: none;
        font-size: var(--qds-type-metadata-size);
        font-variant-numeric: tabular-nums;
        color: var(--el-text-strong);
      }

      .siteRow__btn {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--qds-size-control-standard);
        height: var(--qds-size-control-standard);
        border-radius: var(--qds-radius-control);
        color: var(--el-text-muted);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        transition:
          color var(--qds-motion-replace) ease,
          background-color var(--qds-motion-replace) ease,
          transform var(--qds-motion-floating-fast) var(--el-ease-out);
      }

      .siteRow__btn:active {
        transform: scale(0.96);
      }

      .siteRow__btn.isActive {
        color: var(--el-accent);
        background: var(--el-accent-soft);
      }

      .siteRules {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows var(--qds-motion-spatial-long) var(--el-ease-out);
      }

      .siteRow.isExpanded .siteRules {
        grid-template-rows: 1fr;
      }

      .siteRules__inner {
        overflow: hidden;
        min-height: 0;
      }

      .siteRules__list {
        margin: var(--qds-space-0) var(--qds-space-2) var(--qds-space-2) var(--qds-space-10);
        border-left: solid var(--qds-stroke-emphasis) var(--el-border);
        padding-left: var(--qds-space-3);
      }

      .ruleRow {
        display: flex;
        align-items: center;
        gap: var(--qds-space-2);
        padding: var(--qds-space-1) 0;
      }

      .ruleRow__icon {
        display: inline-flex;
        color: var(--el-accent);
        flex: none;
      }

      .ruleRow__icon svg {
        width: var(--qds-size-icon-xs);
        height: var(--qds-size-icon-xs);
      }

      .ruleRow__selector {
        flex: 1;
        min-width: 0;
        font: var(--qds-type-monospaced-data-weight) var(--qds-type-monospaced-data-size) /
          var(--qds-type-monospaced-data-line) var(--qds-type-monospaced-data-family);
        color: var(--el-text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ruleRow__value {
        flex: none;
        font-size: var(--qds-type-compact-metadata-size);
        font-variant-numeric: tabular-nums;
        color: var(--el-text-muted);
        background: var(--el-surface);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-floating);
        padding: 0 var(--qds-space-2);
      }

      .ruleRow__delete {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--qds-size-icon-xl);
        height: var(--qds-size-icon-xl);
        border-radius: var(--qds-radius-control);
        color: var(--el-text-muted);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        transition:
          color var(--qds-motion-replace) ease,
          background-color var(--qds-motion-replace) ease;
      }

      .ruleRow__delete svg,
      .siteRow__btn svg,
      .siteRow__expand svg {
        width: var(--qds-size-icon-s);
        height: var(--qds-size-icon-s);
      }

      .settingRow {
        display: flex;
        align-items: center;
        gap: var(--qds-space-3);
        padding: var(--qds-space-3) 0;
      }

      .settingRow + .settingRow {
        border-top: var(--qds-stroke-default) solid var(--el-border);
      }

      .settingRow__text {
        flex: 1;
        min-width: 0;
      }

      .settingRow__label {
        display: block;
        font-size: var(--qds-type-row-size);
        font-weight: var(--qds-type-section-title-weight);
        color: var(--el-text-strong);
      }

      .settingRow__hint {
        display: block;
        font-size: var(--qds-type-supporting-size);
        color: var(--el-text);
        text-wrap: pretty;
      }

      .settingRow__range {
        width: 130px;
        accent-color: var(--el-accent);
      }

      .settingRow__value {
        min-width: var(--qds-size-target-touch);
        text-align: right;
        font-size: var(--qds-type-supporting-size);
        font-variant-numeric: tabular-nums;
        color: var(--el-text);
      }

      .radiusPreview {
        width: var(--qds-size-icon-xl);
        height: var(--qds-size-icon-xl);
        flex: none;
        border: solid var(--qds-stroke-emphasis) var(--el-accent);
        background: var(--el-accent-soft);
        transition: border-radius var(--qds-motion-replace) var(--el-ease-out);
      }

      .switch {
        display: inline-flex;
        align-items: center;
        position: relative;
        width: var(--qds-size-target-touch);
        height: var(--qds-size-control-standard);
        min-width: var(--qds-size-control-standard);
        min-height: var(--qds-size-control-standard);
        padding: var(--qds-space-1);
        border: 0;
        border-radius: var(--qds-radius-floating);
        background-color: var(--el-border);
        cursor: pointer;
        flex: none;
        transition:
          background-color var(--qds-motion-spatial) ease,
          box-shadow var(--qds-motion-spatial) ease;
      }

      .switch__knob {
        width: var(--qds-size-icon-xl);
        height: var(--qds-size-icon-xl);
        border-radius: 50%;
        background-color: var(--el-knob);
        box-shadow: 0 1px 3px var(--qds-fill-scrim);
        transform: translateX(0);
        transition:
          transform var(--qds-motion-spatial-long) var(--el-ease-drawer),
          background-color var(--qds-motion-disclosure) ease;
      }

      .switch[aria-checked='true'] {
        background-color: var(--el-accent);
        box-shadow: 0 0 0 3px var(--el-accent-soft);
      }

      .switch[aria-checked='true'] .switch__knob {
        background-color: var(--el-accent-contrast);
        transform: translateX(12px);
      }

      .modalOverlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--qds-space-5);
        background: var(--qds-fill-scrim);
        animation: modalFade var(--qds-motion-dismiss) ease;
      }

      @keyframes modalFade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .modal {
        width: min(var(--qds-component-overlay-dialog-readable-width), 100%);
        max-height: min(720px, calc(100vh - var(--qds-size-control-prominent)));
        overflow-y: auto;
        overscroll-behavior: contain;
        background: var(--el-surface);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-panel);
        box-shadow: var(--el-shadow-panel);
        padding: var(--qds-space-5) var(--qds-space-6);
        animation: modalIn var(--qds-motion-disclosure) var(--el-ease-out);
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: scale(0.96) translateY(6px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .modal__title {
        margin: 0 0 var(--qds-space-1);
        font-size: var(--qds-type-section-title-size);
        font-weight: var(--qds-type-display-weight);
        color: var(--el-text-strong);
      }

      .modal__summary {
        margin: 0 0 var(--qds-space-3);
        font-size: var(--qds-type-row-size);
        color: var(--el-text-muted);
        text-wrap: pretty;
      }

      .modal__review {
        display: grid;
        gap: var(--qds-space-1);
        max-height: calc(var(--qds-size-row-comfortable) * 3 + var(--qds-space-1));
        overflow-y: auto;
        margin: 0 0 var(--qds-space-3);
        padding: var(--qds-space-2) var(--qds-space-2);
        background: var(--el-surface-alt);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-group);
        scrollbar-width: thin;
      }

      .modal__reviewRow {
        display: flex;
        justify-content: space-between;
        gap: var(--qds-space-3);
        font-size: var(--qds-type-supporting-size);
        color: var(--el-text);
      }

      .modal__reviewRow span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--el-text-strong);
      }

      .modal__reviewRow span:last-child {
        flex: none;
        color: var(--el-text-muted);
      }

      .modal__reviewMore,
      .modal__warning {
        margin: var(--qds-space-0) 0 0;
        font-size: var(--qds-type-supporting-size);
      }

      .modal__reviewMore {
        color: var(--el-text-muted);
      }

      .modal__warning {
        color: var(--el-danger);
      }

      .modal__choice {
        display: flex;
        align-items: flex-start;
        gap: var(--qds-space-2);
        width: 100%;
        font: inherit;
        text-align: left;
        background: var(--el-surface-alt);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-group);
        padding: var(--qds-space-3) var(--qds-space-3);
        cursor: pointer;
        color: var(--el-text);
        transition:
          border-color var(--qds-motion-replace) ease,
          background-color var(--qds-motion-replace) ease;
      }

      .modal__choice + .modal__choice {
        margin-top: var(--qds-space-2);
      }

      .modal__choice.isSelected {
        border-color: var(--el-accent);
        background: var(--el-accent-soft);
      }

      .modal__choiceLabel {
        display: block;
        font-size: var(--qds-type-row-size);
        font-weight: var(--qds-type-display-weight);
        color: var(--el-text-strong);
      }

      .modal__choiceHint {
        display: block;
        font-size: var(--qds-type-supporting-size);
        color: var(--el-text-muted);
      }

      .modal__actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--qds-space-2);
        margin-top: var(--qds-space-4);
      }

      .about {
        font-size: var(--qds-type-row-size);
        margin: 0;
        text-wrap: pretty;
      }

      .about p {
        margin: 0 0 var(--qds-space-2);
      }

      .about p:last-child {
        margin-bottom: 0;
      }

      .about__documents {
        margin-top: var(--qds-space-3);
        padding: var(--qds-space-3) var(--qds-space-4);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-group);
        background: var(--el-surface-alt);
      }

      .about__links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: var(--qds-space-2) var(--qds-space-3);
      }

      .about a {
        color: var(--el-accent);
        font-weight: var(--qds-type-section-title-weight);
        text-decoration: none;
        border-bottom: var(--qds-stroke-default) solid transparent;
        transition: border-color var(--qds-motion-replace) ease;
      }

      .about .version {
        display: inline-block;
        font-size: var(--qds-type-metadata-size);
        font-weight: var(--qds-type-section-title-weight);
        font-variant-numeric: tabular-nums;
        color: var(--el-text);
        background: var(--el-surface-alt);
        border: var(--qds-stroke-default) solid var(--el-border);
        border-radius: var(--qds-radius-floating);
        padding: var(--qds-space-0) var(--qds-space-2);
        margin-left: var(--qds-space-1);
        vertical-align: 1px;
      }

      /* The settings page deliberately uses one persistent shell: navigation
       * stays quiet and the saved-site history remains the dominant surface. */
      .optionsShell {
        display: grid;
        grid-template-columns:
          minmax(var(--qds-size-sidebar-compact), var(--qds-size-sidebar-standard))
          minmax(0, var(--qds-size-content-readable));
        gap: var(--qds-space-8);
        max-width: calc(
          var(--qds-size-sidebar-standard) + var(--qds-space-8) + var(--qds-size-content-readable)
        );
        margin: 0 auto;
      }

      .optionsNav {
        position: sticky;
        top: var(--qds-space-6);
        align-self: start;
        display: grid;
        gap: var(--qds-space-6);
        padding: var(--qds-space-5);
        border: var(--qds-stroke-default) solid var(--qds-border-default);
        border-radius: var(--qds-component-panel-radius);
        background: var(--qds-surface-overlay);
      }

      .pageHeader {
        display: flex;
        align-items: center;
        gap: var(--qds-space-3);
      }

      .pageHeader__icon {
        width: var(--qds-size-target-touch);
        height: var(--qds-size-target-touch);
        border-radius: var(--qds-radius-control);
      }

      .optionsNav__links {
        display: grid;
        gap: var(--qds-space-1);
      }

      .optionsNav__links a {
        min-height: var(--qds-size-control-standard);
        display: flex;
        align-items: center;
        padding: 0 var(--qds-space-3);
        border-radius: var(--qds-component-interactive-row-radius);
        color: var(--qds-text-secondary);
        font-weight: var(--qds-type-body-emphasized-weight);
        text-decoration: none;
      }

      .optionsNav__links a:hover,
      .optionsNav__links a:focus-visible {
        background: var(--qds-fill-hover);
        color: var(--qds-text-primary);
      }

      .optionsContent {
        min-width: 0;
      }

      .optionsSection + .optionsSection {
        margin-top: var(--qds-space-8);
      }

      .sectionHeading {
        display: flex;
        align-items: center;
        gap: var(--qds-space-2);
        margin: 0 0 var(--qds-space-2);
        color: var(--qds-text-primary);
      }

      .sectionHeading svg {
        color: var(--qds-action-primary);
      }

      .sectionHeading h2 {
        margin: 0;
        font: var(--qds-type-section-title-size) / var(--qds-type-section-title-line)
          var(--qds-type-section-title-family);
        font-weight: var(--qds-type-section-title-weight);
        letter-spacing: var(--qds-type-section-title-tracking);
      }

      .sectionHeading_actions .sortSwitch {
        margin-left: auto;
      }

      .settingsGroup {
        gap: 0;
        padding: 0;
        overflow: hidden;
      }

      .settingsGroup .settingRow {
        min-height: var(--qds-size-target-touch);
        padding: var(--qds-space-3) var(--qds-space-4);
        border-radius: 0;
      }

      .settingsGroup .settingRow:hover {
        background: var(--qds-fill-hover);
      }

      .settingsGroup .settingRow + .settingRow {
        border-top: var(--qds-stroke-default) solid var(--qds-border-default);
      }

      .settingRow_appearance {
        align-items: flex-start;
      }

      .settingRow_appearance .qds-radio-group {
        grid-auto-flow: column;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: min(calc(var(--qds-component-overlay-popover-max-width) - var(--qds-space-8)), 100%);
      }

      .settingRow_appearance .qds-radio-group__option {
        justify-content: center;
        min-height: var(--qds-size-control-standard);
        padding: 0 var(--qds-space-2);
        white-space: nowrap;
      }

      .settingRow_radius .settingRow__range {
        width: min(150px, 25vw);
      }

      .searchArea {
        display: grid;
        gap: var(--qds-space-1);
        margin: 0 0 var(--qds-space-3);
      }

      .searchScope,
      .searchStatus {
        margin: 0;
        color: var(--qds-text-tertiary);
        font: var(--qds-type-supporting-size) / var(--qds-type-supporting-line)
          var(--qds-type-supporting-family);
      }

      .searchControl {
        display: flex;
        gap: var(--qds-space-2);
      }

      .searchControl .search {
        min-height: var(--qds-size-control-standard);
        margin: 0;
      }

      .searchClear {
        flex: none;
      }

      .siteList {
        padding: var(--qds-space-1);
        background: var(--qds-surface-secondary);
      }

      .siteRow__head {
        min-height: var(--qds-size-target-touch);
        padding: var(--qds-space-1) var(--qds-space-2);
      }

      .siteRow__expand,
      .siteRow__btn,
      .ruleRow__delete {
        width: var(--qds-size-control-standard);
        height: var(--qds-size-control-standard);
        min-width: var(--qds-size-control-standard);
        min-height: var(--qds-size-control-standard);
      }

      .recoveryNotice {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--qds-space-4);
        margin-bottom: var(--qds-space-6);
        border-color: var(--qds-border-focus);
        background: var(--qds-fill-selected);
      }

      .recoveryNotice__title,
      .recoveryNotice__copy {
        margin: 0;
      }

      .recoveryNotice__title {
        color: var(--qds-text-primary);
        font-weight: var(--qds-type-body-emphasized-weight);
      }

      .recoveryNotice__copy {
        color: var(--qds-text-secondary);
      }

      .recoveryNotice__actions {
        display: flex;
        flex: none;
        gap: var(--qds-space-2);
      }

      .optionsSection .actions {
        margin-top: var(--qds-space-3);
        padding: var(--qds-space-3);
        background: var(--qds-surface-secondary);
      }

      .optionsSection .about {
        padding: var(--qds-space-4);
      }

      @media (hover: hover) and (pointer: fine) {
        .card:hover::after {
          opacity: 0.72;
          transform: scale(1);
        }

        button.primary:hover:not(:disabled) {
          background: var(--el-accent-hover);
        }

        button.secondary:hover:not(:disabled) {
          background: var(--el-accent-soft);
          border-color: var(--el-accent);
        }

        .sortSwitch__btn:hover,
        .segment__btn:hover {
          color: var(--el-text-strong);
        }

        .siteRow:hover {
          background: var(--el-surface);
        }

        .siteRow__domain:hover {
          color: var(--el-accent);
          text-decoration: underline;
        }

        .siteRow__expand:hover {
          background: var(--el-surface-alt);
          color: var(--el-text-strong);
        }

        .siteRow__btn:hover {
          color: var(--el-accent);
          background: var(--el-accent-soft);
        }

        .siteRow__btn.siteRow__delete:hover,
        .ruleRow__delete:hover {
          color: var(--el-danger);
          background: var(--el-danger-soft);
        }

        .toast__undo:hover {
          background: var(--el-accent-soft);
        }

        .modal__choice:hover {
          border-color: var(--el-accent);
        }

        .about a:hover {
          border-bottom-color: var(--el-accent);
        }
      }

      @media (max-width: 520px) {
        body {
          padding: var(--qds-space-6) var(--qds-space-3) var(--qds-space-10);
        }

        .card,
        .card.pageHeader {
          padding-left: var(--qds-space-4);
          padding-right: var(--qds-space-4);
        }

        .cardTitle {
          flex-wrap: wrap;
        }

        .sortSwitch {
          width: 100%;
          margin: var(--qds-space-2) 0 0;
        }

        .sortSwitch__btn {
          flex: 1;
        }

        .siteRow__date {
          display: none;
        }

        .actions {
          align-items: stretch;
          flex-direction: column;
        }

        .settingRow {
          flex-wrap: wrap;
        }

        .optionsShell {
          display: block;
        }

        .optionsNav {
          position: static;
          gap: var(--qds-space-3);
          margin-bottom: var(--qds-space-6);
          padding: var(--qds-space-4);
        }

        .optionsNav__links {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .optionsNav__links a {
          justify-content: center;
          padding: 0 var(--qds-space-2);
        }

        .settingRow_appearance .qds-radio-group {
          width: 100%;
        }

        .settingRow_radius .settingRow__range {
          flex: 1;
          width: auto;
        }

        .recoveryNotice {
          align-items: stretch;
          flex-direction: column;
        }

        .recoveryNotice__actions {
          width: 100%;
        }

        .recoveryNotice__actions button {
          flex: 1;
        }

        .modalOverlay {
          align-items: flex-end;
          padding: var(--qds-space-2);
        }

        .modal {
          max-height: min(82vh, 720px);
          padding: var(--qds-space-4);
          border-radius: var(--qds-radius-panel);
        }

        .modal__actions button {
          min-height: var(--qds-size-target-touch);
          flex: 1;
        }
      }

      @media (max-width: 360px) {
        .siteList,
        .siteList__rows,
        .siteRow,
        .siteRow__head,
        .siteRules,
        .siteRules__inner {
          min-width: 0;
          max-width: 100%;
        }

        .siteRow__head {
          gap: var(--qds-space-1);
          padding-inline: var(--qds-space-1);
        }

        .siteRow__domain {
          min-width: 0;
        }

        .siteRow__count {
          display: none;
        }
      }

      @media (pointer: coarse) {
        .sortSwitch__btn,
        .switch,
        .optionsNav__links a {
          min-height: var(--qds-size-target-touch);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .siteRow {
          animation: none;
        }

        .modal,
        .modalOverlay {
          animation: none;
        }

        .toast,
        .card,
        button.primary,
        button.secondary,
        .sortSwitch__btn,
        .segment__btn,
        .siteRow,
        .siteRow__btn,
        .siteRow__expand,
        .siteRow__expand svg,
        .siteRules,
        .switch,
        .switch__knob,
        .about a {
          transition: none;
        }

        .spinner {
          animation-duration: var(--qds-motion-spatial-long);
        }

        .card::after {
          transform: none;
          transition: opacity var(--qds-motion-floating-fast) ease;
        }
      }

      @media (prefers-contrast: more) {
        .card,
        .siteList,
        .siteRow,
        .recoveryNotice,
        .modal,
        .settingGroup {
          border-color: var(--qds-border-focus);
          border-width: var(--qds-stroke-emphasis);
        }

        .siteRow__count,
        .siteRow__date,
        .cardDescription,
        .settingRow__description {
          color: var(--qds-text-primary);
        }
      }

      @media (forced-colors: active) {
        .card,
        .siteList,
        .siteRow,
        .siteRow__head,
        .recoveryNotice,
        .modal,
        .modalOverlay,
        .settingGroup,
        .sortSwitch,
        .switch,
        input,
        button,
        a {
          border-color: ButtonBorder;
          background: Canvas;
          color: CanvasText;
          forced-color-adjust: auto;
        }

        :focus-visible {
          outline-color: Highlight;
        }

        input:checked + *,
        [aria-current='true'],
        [aria-pressed='true'] {
          background: Highlight;
          color: HighlightText;
        }
      }
    </style>
    <script type="module" src="./options/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
