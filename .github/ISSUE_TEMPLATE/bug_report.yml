name: Bug report
description: Report a reproducible problem in Elements
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Report security vulnerabilities through GitHub's private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Elements version
      placeholder: '1.2.0'
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome or Chromium
        - Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating-system versions
      placeholder: 'Chrome 140 on macOS 15'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, video, or console output
      description: Remove private page content before attaching files.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested the latest release or current master.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true
