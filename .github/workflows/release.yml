name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        env:
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: npm run verify:release -- "$TAG_NAME"

      - name: Validate source
        run: npm run validate

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Build Chrome for end-to-end tests
        run: npm run build:chrome

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build release archives
        run: npm run release:archives

      - name: Verify build artifacts
        run: npm run verify:build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          gh release create "$TAG_NAME" \
            --target "${{ github.sha }}" \
            --draft \
            --title "Elements $TAG_NAME" \
            --generate-notes \
            .output/*.zip
